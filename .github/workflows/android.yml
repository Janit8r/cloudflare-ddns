name: Android Build

# -------------------------------------------------------------------------------
# 自动交叉编译 cloudflare-ddns 的 Android 版本 (Rust binary crate)。
#
# 关键决策（踩坑记录）：
#   1) 项目用 rustls + ring（无 OpenSSL C 依赖），交叉编译仅需正确的 NDK 工具链。
#   2) 第一版手动设置 CC_*/CARGO_TARGET_*_LINKER 环境变量，但 ring 的 cc-rs 构建脚本
#      按旧式命名探测 "arm-linux-androideabi-clang"（NDK r27 实际为
#      "armv7a-linux-androideabi<api>-clang"），armeabi-v7a 构建失败。
#   3) 第二版改用 cargo-ndk，编译能通过，但收尾报
#      "No usable artifacts produced by cargo ... cdylib?" 退出 1 —— cargo-ndk 只复制
#      cdylib 产物，而本项目是纯 bin 守护进程（无 cdylib），故永远不可用。
#   4) 第三版改用 .cargo/config.toml 的 [target.<triple>.env] 注入 CC —— 但 Cargo 根本
#      不支持 [target.<triple>.env]，该段被静默忽略，CC 仍为空，ring 再次回退探测
#      arm-linux-androideabi-clang 而失败。
#   5) 最终方案（本文件）：复刻 cargo-ndk 真正起作用的机制 —— 把每个 Android target 的
#      linker / CC / CXX / AR 作为【真实环境变量】，用 `env VAR=val ... cargo build`
#      注入（注意：bash 的 export 不支持连字符变量名 CC_armv7-linux-androideabi，必须用
#      env 或 GitHub 的 $GITHUB_ENV，二者都走 OS 级 setenv）。变量名用 Rust target triple
#      （armv7-linux-androideabi），值指向 NDK 包装脚本（armv7a-linux-androideabi<api>-clang），
#      差异在此对齐。最后由我们手动拷贝产物。
#   6) 老固件 linker 兼容：部分老 Android box（如 Hi3798MV310 / mangosteen，内核 3.10.x）
#      用的是老版本 /system/bin/linker，只认传统的 DT_HASH（.hash 段），而现代 NDK/LLVM
#      默认只生成 .gnu.hash（--hash-style=gnu），加载时直接报
#      "empty/missing DT_HASH in ... (built with --hash-style=gnu?)"。修复：链接参数加
#      -Wl,--hash-style=both（同时生成 .hash 与 .gnu.hash），新老 linker 都兼容。
#   7) getifaddrs / __register_atfork / epoll_create1 / signal 垫片：老 bionic（内核 3.10.x /
#      Android < 5.0，API 普遍 < 21）隐藏或缺失这些符号，而 NDK r27 预编译的 Rust std 与 NDK 自
#      身 crt 启动对象会直接引用它们，加载期报 "cannot locate symbol XXX"。为每个目标链入垫片
#      （--whole-archive 强制保留），为空实现/转调（getifaddrs→空列表、__register_atfork→
#      pthread_atfork、epoll_create1→epoll_create、signal→sigaction）。见 libs/getifaddrs_shim.c。
#   8) build-std 从源头消除 std 侧的高 API 符号引用：上一条的垫片只兜 NDK crt / std 运行时的
#      缺符号；更彻底的做法是用 `-Z build-std`（需 nightly 工具链 + rust-src）把 std 按更低的
#      `android-api` 重编——std 在 android-api<24 时不用 getifaddrs，从而不再引用设备的缺失符号。
#      android-api 统一设 21：NDK r27 最低只支持 API 21（无 19/20 的 platform，设更低 build-std
#      会找不到 platform 而失败），且 21 已是 armv7/i686 在 r27 下能触达的最低值。注意 android-api
#      必须以 .cargo/config.toml 形式写入，不能用 `--config target.x.android-api=21` CLI 传整数值
#      （Cargo 会报 "expected a table, but found a integer"）。build-std 仍需 nightly。
#   9) 若仍出现个别 cannot locate symbol "XXX"：先确认是 std 侧还是 NDK crt 侧；若是 std 侧且
#      build-std 未覆盖，继续下调对应目标 android-api；若是 NDK crt 侧，往 libs/getifaddrs_shim.c
#      追加该符号的 no-op / 转调实现即可（垫片对所有目标链入，无需改 CI/脚本接线）。
#
# 运行环境：
#   默认 runs-on: ubuntu-latest（x86_64 官方托管机），可运行标准 x86_64 NDK 并交叉编译
#   Android ARM / x86 产物，这是最稳妥的方案。
#   若需在你描述的 armv8l (32 位 ARM) 自托管 Runner 上运行：官方 NDK 没有 32 位 ARM 宿主
#   包，x86_64 版 NDK 无法在 armv8l 上执行。请改用官方 ubuntu-latest，或若自托管机实际为
#   64 位 ARM(aarch64)，把 NDK 下载包换成 linux-aarch64 版（NDK r25+）并改 prebuilt 目录为
#   linux-aarch64。你描述的 armv8l 目标设备对应下方 armeabi-v7a 产物。
#
# 目标架构映射：
#   - aarch64-linux-android  → arm64-v8a     （64 位 ARM）
#   - armv7-linux-androideabi → armeabi-v7a   （32 位 ARM；NDK clang 前缀是 armv7a-...）
#   - i686-linux-android      → x86           （32 位 x86；NDK r27 仍支持该 ABI，ring 0.17
#                                               的 Android 平台支持含 OPENSSL_X86，可编译）
#   注: 你给的内核信息用于判断目标设备架构。i686 设备（内核 3.10.0 的老机器）对应 x86；
#       NDK r25+ 最低 API 为 21，故 ANDROID_API 固定为 21，build-std 的 android-api 也取 21，
#       与 NDK clang 包装脚本（aarch64-linux-android21-clang 等）保持一致。若设备系统低于
#       Android 5.0(API 21) 仍报缺符号，需把 NDK 降到 r23b(min API 19)/r21e(min API 16) 才能
#       链接更旧的 platform。
# -------------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release 使用

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NDK_VERSION: r27c
  ANDROID_API: "21"

jobs:
  android:
    name: Build Android (arm64-v8a + armeabi-v7a + x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly + rust-src for build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android
          components: rust-src

      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # 复刻 cargo-ndk 真正起作用的机制：把工具链变量以 [真实环境变量] 形式用 env 注入
      # cargo build（bash 的 export 不支持连字符变量名，故用 env 命令）。
      # 关键：变量名用 Rust target triple（armv7-linux-androideabi / i686-linux-android），
      # 值指向 NDK 包装脚本（armv7a-linux-androideabi<api>-clang / i686-linux-android<api>-clang），
      # cc-rs 通过 CC_<triple> 读取，从而不再回退去探测旧式命名。
      - name: Build release binaries for Android
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ env.ANDROID_API }}"
          echo "NDK_BIN=$NDK_BIN"
          ls "$NDK_BIN" | grep -E "clang$|llvm-ar$" | head

          # <triple><api>-clang 优先；不存在则回退到 <triple>-clang。
          # 注意 armv7 的 NDK clang 前缀是 armv7a-（多一个 a），而 Rust triple 是 armv7-。
          clang_for() {
            local triple="$1" w
            w="$NDK_BIN/${triple}${API}-clang"
            [ -x "$w" ] || w="$NDK_BIN/${triple}-clang"
            echo "$w"
          }
          CC_A="$(clang_for aarch64-linux-android)"
          CC_V7="$(clang_for armv7a-linux-androideabi)"
          CC_X86="$(clang_for i686-linux-android)"
          echo "aarch64 clang: $CC_A"
          echo "armv7   clang: $CC_V7"
          echo "i686    clang: $CC_X86"

          # getifaddrs shim for ALL targets: some old Android firmwares (e.g. the
          # "mangosteen" aarch64 box, kernel 3.10.x; also reported on AOW-PC x86)
          # ship a bionic lacking getifaddrs even though the Rust prebuilt std::net
          # references it as a hard symbol, causing "cannot locate symbol getifaddrs"
          # at load time. Provide a no-op shim (empty interface list) for every
          # target so the binaries don't depend on the device bionic for this symbol.
          # (cloudflare-ddns discovers its public IP via external services, so an
          # empty interface list is harmless.)
          SHIM_A="$PWD/getifaddrs_shim_aarch64.o"
          SHIM_V7="$PWD/getifaddrs_shim_armv7.o"
          SHIM_X86="$PWD/getifaddrs_shim_i686.o"
          "$CC_A"   libs/getifaddrs_shim.c -c -o "$SHIM_A"
          "$CC_V7"  libs/getifaddrs_shim.c -c -o "$SHIM_V7"
          "$CC_X86" libs/getifaddrs_shim.c -c -o "$SHIM_X86"
          echo "getifaddrs shims: $SHIM_A $SHIM_V7 $SHIM_X86"

          # 把每个目标的 android-api 写进 .cargo/config.toml（避免 --config CLI 对整数值
          # 解析报 "expected a table, but found a integer"）。NDK r27 最低支持 API 21，故三个
          # 目标统一设 21；build-std 据此用 API 21 重编 std，避免引用更高的 API 符号。
          mkdir -p .cargo
          echo '[target.aarch64-linux-android]' > .cargo/config.toml
          echo 'android-api = 21' >> .cargo/config.toml
          echo '' >> .cargo/config.toml
          echo '[target.armv7-linux-androideabi]' >> .cargo/config.toml
          echo 'android-api = 21' >> .cargo/config.toml
          echo '' >> .cargo/config.toml
          echo '[target.i686-linux-android]' >> .cargo/config.toml
          echo 'android-api = 21' >> .cargo/config.toml
          echo "--- .cargo/config.toml ---"
          cat .cargo/config.toml

          mkdir -p out
          env \
            CC_aarch64-linux-android="$CC_A" \
            CXX_aarch64-linux-android="$CC_A++" \
            AR_aarch64-linux-android="$NDK_BIN/llvm-ar" \
            RANLIB_aarch64-linux-android="$NDK_BIN/llvm-ranlib" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_A" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_BIN/llvm-ar" \
            CC_armv7-linux-androideabi="$CC_V7" \
            CXX_armv7-linux-androideabi="$CC_V7++" \
            AR_armv7-linux-androideabi="$NDK_BIN/llvm-ar" \
            RANLIB_armv7-linux-androideabi="$NDK_BIN/llvm-ranlib" \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CC_V7" \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$NDK_BIN/llvm-ar" \
            CC_i686-linux-android="$CC_X86" \
            CXX_i686-linux-android="$CC_X86++" \
            AR_i686-linux-android="$NDK_BIN/llvm-ar" \
            RANLIB_i686-linux-android="$NDK_BIN/llvm-ranlib" \
            CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$CC_X86" \
            CARGO_TARGET_I686_LINUX_ANDROID_AR="$NDK_BIN/llvm-ar" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-Clink-arg=-Wl,--hash-style=both -Clink-arg=-Wl,--whole-archive -Clink-arg=$SHIM_A -Clink-arg=-Wl,--no-whole-archive" \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS="-Clink-arg=-Wl,--hash-style=both -Clink-arg=-Wl,--whole-archive -Clink-arg=$SHIM_V7 -Clink-arg=-Wl,--no-whole-archive" \
            CARGO_TARGET_I686_LINUX_ANDROID_RUSTFLAGS="-Clink-arg=-Wl,--hash-style=both -Clink-arg=-Wl,--whole-archive -Clink-arg=$SHIM_X86 -Clink-arg=-Wl,--no-whole-archive" \
            cargo +nightly build -Z build-std \
              --target aarch64-linux-android \
              --target armv7-linux-androideabi \
              --target i686-linux-android \
              --release
          cp -v "target/aarch64-linux-android/release/cloudflare-ddns" "out/cloudflare-ddns-arm64-v8a"
          cp -v "target/armv7-linux-androideabi/release/cloudflare-ddns" "out/cloudflare-ddns-armeabi-v7a"
          cp -v "target/i686-linux-android/release/cloudflare-ddns" "out/cloudflare-ddns-x86"
          ls -l out
          file out/cloudflare-ddns-* || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: out/cloudflare-ddns-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cloudflare-ddns-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
