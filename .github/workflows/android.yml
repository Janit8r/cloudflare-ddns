name: Android Build

# -------------------------------------------------------------------------------
# 自动交叉编译 cloudflare-ddns 的 Android 版本 (Rust binary crate)。
#
# 关键决策（踩坑记录）：
#   1) 项目用 rustls + ring（无 OpenSSL C 依赖），交叉编译仅需正确的 NDK 工具链。
#   2) 第一版手动设置 CC_*/CARGO_TARGET_*_LINKER 环境变量失败了：ring 的 cc-rs 按
#      旧式命名探测 "arm-linux-androideabi-clang"（NDK r27 实际为
#      "armv7a-linux-androideabi<api>-clang"），armeabi-v7a 构建挂掉。
#   3) 第二版改用 cargo-ndk，编译能通过，但它在收尾阶段报
#      "No usable artifacts produced by cargo ... Did you set the crate-type to
#      cdylib?" 后退出 1 —— 因为 cargo-ndk 只复制 cdylib 产物，而本项目是纯
#      bin 守护进程（无任何 cdylib），所以它永远无法用于本仓库。
#   4) 最终方案（本文件）：丢掉 cargo-ndk 的复制阶段，直接复刻它底层的工具链配置
#      —— 把每个 Android target 的 linker / CC / CXX / AR 指向 NDK 的 clang 包装脚本
#      （aarch64-linux-android24-clang、armv7a-linux-androideabi24-clang）+ llvm-ar。
#      这样既能规避 armv7 命名差异，又能正确产出可执行文件，再由我们手动拷贝产物。
#
# 运行环境：
#   默认 runs-on: ubuntu-latest（x86_64 官方托管机），可运行标准 x86_64 NDK 并交叉
#   编译 Android ARM 产物，这是最稳妥的方案。
#   若需在你描述的 armv8l (32 位 ARM) 自托管 Runner 上运行：官方 NDK 没有 32 位 ARM
#   宿主包，x86_64 版 NDK 无法在 armv8l 上执行。请改用官方 ubuntu-latest，或若自托管
#   机实际为 64 位 ARM(aarch64)，把 NDK 下载包换成 linux-aarch64 版（NDK r25+）并改
#   prebuilt 目录为 linux-aarch64。你描述的 armv8l 目标设备对应下方 armeabi-v7a 产物。
# -------------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release 使用

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NDK_VERSION: r27c
  ANDROID_API: "24"

jobs:
  android:
    name: Build Android (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # 复刻 cargo-ndk 的工具链配置（见文件头注释）：
      # 为每个 Android target 设置 linker / CC / CXX / AR 指向 NDK clang 包装脚本。
      # 关键点：armeabi-v7a 对应的 Rust target 是 armv7-linux-androideabi，而 NDK
      # 的 clang 包装脚本命名为 armv7a-linux-androideabi<api>-clang，差异由这里补齐。
      - name: Configure NDK toolchain for Cargo
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ env.ANDROID_API }}"
          echo "NDK_BIN=$NDK_BIN"
          ls "$NDK_BIN" | grep -E "clang$|llvm-ar$" | head

          # 解析每个 target 对应的 NDK clang 包装脚本。
          # NDK r27 提供 <triple><api>-clang 形式（如 aarch64-linux-android24-clang）；
          # 若指定 API 级别的包装脚本不存在，回退到无 API 的 <triple>-clang。
          clang_for() {
            local triple="$1" w
            w="$NDK_BIN/${triple}${API}-clang"
            [ -x "$w" ] || w="$NDK_BIN/${triple}-clang"
            echo "$w"
          }
          CC_AARCH64="$(clang_for aarch64-linux-android)"
          CC_ARMV7="$(clang_for armv7a-linux-androideabi)"
          echo "CC_AARCH64=$CC_AARCH64"
          echo "CC_ARMV7=$CC_ARMV7"

          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          # 由 CI 自动生成：NDK r27c 交叉编译工具链配置（Android targets）。
          [target.aarch64-linux-android]
          linker = "$CC_AARCH64"

          [target.aarch64-linux-android.env]
          CC_aarch64-linux-android     = "$CC_AARCH64"
          CXX_aarch64-linux-android    = "${CC_AARCH64}++"
          AR_aarch64-linux-android     = "$NDK_BIN/llvm-ar"
          RANLIB_aarch64-linux-android = "$NDK_BIN/llvm-ranlib"

          [target.armv7-linux-androideabi]
          linker = "$CC_ARMV7"

          [target.armv7-linux-androideabi.env]
          CC_armv7-linux-androideabi     = "$CC_ARMV7"
          CXX_armv7-linux-androideabi    = "${CC_ARMV7}++"
          AR_armv7-linux-androideabi     = "$NDK_BIN/llvm-ar"
          RANLIB_armv7-linux-androideabi = "$NDK_BIN/llvm-ranlib"
          EOF
          echo "----- .cargo/config.toml -----"
          cat .cargo/config.toml

      - name: Build release binaries for Android
        run: |
          set -euo pipefail
          mkdir -p out
          cargo build \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --release
          cp -v "target/aarch64-linux-android/release/cloudflare-ddns" "out/cloudflare-ddns-arm64-v8a"
          cp -v "target/armv7-linux-androideabi/release/cloudflare-ddns" "out/cloudflare-ddns-armeabi-v7a"
          ls -l out
          file out/cloudflare-ddns-* || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: out/cloudflare-ddns-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cloudflare-ddns-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
