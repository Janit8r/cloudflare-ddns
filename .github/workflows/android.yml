name: Android Build

# -------------------------------------------------------------------------------
# 自动交叉编译 cloudflare-ddns 的 Android 版本 (Rust)。
#
# 关键决策：
#   本项目用 rustls + ring（无 OpenSSL C 依赖），交叉编译仅需正确的 NDK 工具链。
#   早期版本手动设置 CC_*/CARGO_TARGET_*_LINKER 环境变量，但 ring 的 cc-rs 构建脚本
#   会按旧式命名探测 "arm-linux-androideabi-clang"（而 NDK r27 实际为
#   "armv7a-linux-androideabi<api>-clang"），导致 armeabi-v7a 构建失败。
#   因此改用 cargo-ndk —— 它会为每个 Android 目标正确设置 linker / CC / AR / sysroot，
#   彻底规避命名差异问题。
#
# 运行环境：
#   默认 runs-on: ubuntu-latest（x86_64 官方托管机），可运行标准 x86_64 NDK 并交叉编译
#   Android ARM 产物，这是最稳妥的方案。
#   若需在你描述的 armv8l (32 位 ARM) 自托管 Runner 上运行：官方 NDK 没有 32 位 ARM
#   宿主包，x86_64 版 NDK 无法在 armv8l 上执行。请改用官方 ubuntu-latest，或若自托管机
#   实际为 64 位 ARM(aarch64)，把 NDK 下载包换成 linux-aarch64 版（NDK r25+）并改
#   prebuilt 目录为 linux-aarch64。你描述的 armv8l 目标设备对应下方 armeabi-v7a 产物。
# -------------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 供 softprops/action-gh-release 创建 Release 使用

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NDK_VERSION: r27c
  ANDROID_API: "24"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  android:
    name: Build Android (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cache cargo-ndk binary
        id: cargondk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}

      - name: Install cargo-ndk
        if: steps.cargondk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries for Android
        run: |
          cargo ndk \
            --platform ${{ env.ANDROID_API }} \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ./android-build \
            build --release

      - name: Prepare artifacts
        run: |
          mkdir -p out
          # cargo-ndk 输出目录按 ABI 命名（arm64-v8a / armeabi-v7a）
          find ./android-build -type f -name cloudflare-ddns | while read -r bin; do
            abi="$(basename "$(dirname "$bin")")"
            cp "$bin" "out/cloudflare-ddns-$abi"
          done
          ls -l out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: out/cloudflare-ddns-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-ddns-android
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cloudflare-ddns-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
